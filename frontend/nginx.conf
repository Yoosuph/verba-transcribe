# Templated by the official nginx image (envsubst on /etc/nginx/templates/*.template).
# ${AUTH_TOKEN} is injected into index.html (meta tag) and as an Authorization
# header on proxied API/WS requests — the browser never needs it hardcoded.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Inject the shared auth token into the served HTML
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter "%%AUTH_TOKEN%%" "${AUTH_TOKEN}";

    # SPA fallback (serve index with substitutions applied)
    location = /index.html {
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter "%%AUTH_TOKEN%%" "${AUTH_TOKEN}";
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${AUTH_TOKEN}";
    }

    # Reverse proxy WebSocket connections to backend container
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer ${AUTH_TOKEN}";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
