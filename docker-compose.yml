services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: judiciary_transcribe_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-gemini-3.5-transcribe-live}
      - GEMINI_FINAL_MODEL=${GEMINI_FINAL_MODEL:-gemini-3.5-transcribe}
      - GEMINI_SUMMARY_MODEL=${GEMINI_SUMMARY_MODEL:-gemini-3.8-flash}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:80}
      - MAX_SESSION_MINUTES=${MAX_SESSION_MINUTES:-30}
      - MAX_AUDIO_SIZE_MB=${MAX_AUDIO_SIZE_MB:-100}
      - TEMP_AUDIO_DIR=/tmp/judiciary_audio
    env_file:
      - .env
    volumes:
      - /tmp/judiciary_audio:/tmp/judiciary_audio

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: judiciary_transcribe_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
